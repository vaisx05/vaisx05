name: koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

concurrency:
  group: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Update koi"
          git push
